<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Welcome Home — Conversation Cards</title>
<style>
  html, body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
</style>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap');

  #wh-cards * { box-sizing: border-box; }

  #wh-cards {
    --ink: #350B2D;
    --ink-soft: rgba(53,11,45,0.56);
    --ink-faint: rgba(53,11,45,0.32);
    --paper: #FBF7F1;
    --l1: #F5ECDB;
    --l2: #F2CE90;
    --l3: #FAAE56;
    --l4: #F8967B;
    font-family: 'Poppins', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100%;
    padding: 28px 16px 60px;
    display: flex;
    justify-content: center;
  }

  #wh-cards .wrap {
    width: 100%;
    max-width: 420px;
  }

  #wh-cards .kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 0 6px;
  }

  #wh-cards h1 {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 6px;
    line-height: 1.15;
  }

  #wh-cards .sub {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 0 22px;
    line-height: 1.5;
  }

  #wh-cards .levels {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  #wh-cards .level-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 9px 4px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    background: #ffffff;
    color: var(--ink-soft);
    border: 1.5px solid rgba(53,11,45,0.14);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    line-height: 1.25;
  }

  #wh-cards .level-btn .dot-row {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 5px;
  }

  #wh-cards .level-btn .dot-row span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(53,11,45,0.22);
    display: inline-block;
  }

  #wh-cards .level-btn.active {
    color: var(--ink);
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(53,11,45,0.16);
    transform: translateY(-1px);
  }

  #wh-cards .level-btn.active .dot-row span.filled {
    background: var(--ink);
  }

  #wh-cards .blurb {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.55;
    color: var(--ink-soft);
    text-align: center;
    min-height: 58px;
    margin-bottom: 18px;
    transition: opacity 0.25s ease;
  }

  #wh-cards .stage {
    perspective: 1400px;
    margin-bottom: 18px;
  }

  #wh-cards .card {
    position: relative;
    width: 100%;
    aspect-ratio: 239 / 311;
    max-height: 62vh;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.61,.06,.4,.98);
    cursor: pointer;
  }

  #wh-cards .face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    box-shadow: 0 14px 34px rgba(53,11,45,0.16);
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
  }

  #wh-cards .face.front {
    transform: rotateY(0deg);
  }

  #wh-cards .face.back {
    transform: rotateY(180deg);
    overflow: hidden;
    justify-content: flex-end;
    align-items: flex-start;
  }

  #wh-cards .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  #wh-cards .category {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  #wh-cards .dots {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    padding-top: 3px;
  }

  #wh-cards .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-faint);
    display: inline-block;
  }

  #wh-cards .dots span.filled {
    background: var(--ink);
  }

  #wh-cards .type {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 22px;
  }

  #wh-cards .question {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.32;
    margin-top: 10px;
  }

  #wh-cards .wordmark {
    font-weight: 800;
    line-height: 0.86;
    text-transform: lowercase;
    letter-spacing: -0.01em;
    word-break: break-word;
  }

  #wh-cards .wordmark .small {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  #wh-cards .wordmark .big {
    display: block;
    font-size: 54px;
  }

  #wh-cards .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  #wh-cards .draw-btn {
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 15px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--paper);
    background: var(--ink);
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }

  #wh-cards .draw-btn:active {
    transform: scale(0.98);
  }

  #wh-cards .list-toggle {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px;
  }

  #wh-cards .list-view {
    margin-top: 18px;
    border-top: 1.5px solid rgba(53,11,45,0.14);
    padding-top: 16px;
  }

  #wh-cards .list-view h2 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 16px 0 8px;
  }

  #wh-cards .list-view h2:first-child {
    margin-top: 0;
  }

  #wh-cards .list-item {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    padding: 9px 0;
    border-bottom: 1px solid rgba(53,11,45,0.08);
  }

  #wh-cards .list-item .li-type {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 2px;
  }

  #wh-cards footer {
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 26px;
    font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) {
    #wh-cards .card { transition: none; }
  }
</style>

<div id="wh-cards">
  <div class="wrap">
    <p class="kicker">Welcome Home</p>
    <h1>Conversation Cards</h1>
    <p class="sub">Pick a level, then draw a card. Permission to pass always applies.</p>

    <div class="levels" id="levelBtns"></div>
    <p class="blurb" id="blurb"></p>

    <div class="stage">
      <div class="card" id="card">
        <div class="face front" id="faceFront">
          <div class="card-top">
            <span class="category" id="cardCategory"></span>
            <span class="dots" id="cardDots"></span>
          </div>
          <span class="type" id="cardType"></span>
          <p class="question" id="cardQuestion"></p>
        </div>
        <div class="face back" id="faceBack">
          <div class="wordmark" id="cardWordmark"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="draw-btn" id="drawBtn">Draw a card</button>
      <button class="list-toggle" id="listToggle">Browse all questions in this level</button>
    </div>

    <div class="list-view" id="listView" hidden></div>

    <footer>131 cards &middot; 4 levels &middot; 9 categories</footer>
  </div>
</div>

  var LEVELS = {"1": {"name": "Hiding by the Snacks", "bg": "#F5ECDB", "blurb": "The daft, low-stakes stuff you’d happily tell a stranger at a bus stop."}, "2": {"name": "Moving to the Couch", "bg": "#F2CE90", "blurb": "The kind of stuff that comes out over a second drink."}, "3": {"name": "3AM Thoughts", "bg": "#FAAE56", "blurb": "The heavy, honest stuff you usually only tell your ceiling."}, "4": {"name": "Pillow Talk", "bg": "#F8967B", "blurb": "The ultimate level of unfiltered vulnerability. Conversations you have in the dark when you feel completely safe. Don’t panic — you chose to be this honest."}};

  var state = {
    level: 1,
    queues: {1: [], 2: [], 3: [], 4: []},
    current: null,
    flipped: false
  };

  var byLevel = {1: [], 2: [], 3: [], 4: []};
  CARDS.forEach(function(c) { byLevel[c.level].push(c); });

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function refillQueue(level) {
    state.queues[level] = shuffle(byLevel[level]);
  }

  function nextCard(level) {
    if (state.queues[level].length === 0) refillQueue(level);
    return state.queues[level].pop();
  }

  var levelBtnsEl = document.getElementById('levelBtns');
  Object.keys(LEVELS).forEach(function(lvl) {
    var meta = LEVELS[lvl];
    var btn = document.createElement('button');
    btn.className = 'level-btn';
    btn.dataset.level = lvl;
    var dotRow = document.createElement('span');
    dotRow.className = 'dot-row';
    for (var i = 1; i <= 4; i++) {
      var d = document.createElement('span');
      if (i <= parseInt(lvl, 10)) d.className = 'filled';
      dotRow.appendChild(d);
    }
    btn.appendChild(dotRow);
    var label = document.createElement('span');
    label.textContent = meta.name;
    btn.appendChild(label);
    btn.addEventListener('click', function() { setLevel(parseInt(lvl, 10)); });
    levelBtnsEl.appendChild(btn);
  });

  var cardEl = document.getElementById('card');
  var blurbEl = document.getElementById('blurb');
  var drawBtn = document.getElementById('drawBtn');
  var listToggle = document.getElementById('listToggle');
  var listView = document.getElementById('listView');
  var rotationSteps = 0;
  var listOpen = false;

  function renderDots(container, level) {
    container.innerHTML = '';
    for (var i = 1; i <= 4; i++) {
      var d = document.createElement('span');
      if (i <= level) d.className = 'filled';
      container.appendChild(d);
    }
  }

  function paintFront(card) {
    document.getElementById('cardCategory').textContent = card.category;
    document.getElementById('cardType').textContent = card.type;
    document.getElementById('cardQuestion').textContent = card.question;
    renderDots(document.getElementById('cardDots'), card.level);
    document.querySelectorAll('#wh-cards .face').forEach(function(f) {
      f.style.background = LEVELS[card.level].bg;
    });
  }

  function paintBack(level) {
    var meta = LEVELS[level];
    var lower = meta.name.toLowerCase();
    var wm = document.getElementById('cardWordmark');
    wm.innerHTML = '<span class="big">' + lower + '</span>';
  }

  function setLevelBtnActive(level) {
    document.querySelectorAll('.level-btn').forEach(function(b) {
      b.classList.toggle('active', parseInt(b.dataset.level, 10) === level);
    });
  }

  function setLevel(level) {
    state.level = level;
    setLevelBtnActive(level);
    blurbEl.style.opacity = 0;
    setTimeout(function() {
      blurbEl.textContent = LEVELS[level].blurb;
      blurbEl.style.opacity = 1;
    }, 120);
    paintBack(level);
    state.current = nextCard(level);
    rotationSteps = 0;
    cardEl.style.transition = 'none';
    cardEl.style.transform = 'rotateY(0deg)';
    paintFront(state.current);
    void cardEl.offsetWidth;
    cardEl.style.transition = '';
    if (listOpen) renderList(level);
  }

  function draw() {
    var level = state.level;
    rotationSteps += 1;
    cardEl.style.transform = 'rotateY(' + (rotationSteps * 180) + 'deg)';
    setTimeout(function() {
      state.current = nextCard(level);
      paintFront(state.current);
    }, 300);
  }

  cardEl.addEventListener('click', draw);
  drawBtn.addEventListener('click', draw);

  function renderList(level) {
    var cards = byLevel[level];
    var byCat = {};
    var order = [];
    cards.forEach(function(c) {
      if (!byCat[c.category]) { byCat[c.category] = []; order.push(c.category); }
      byCat[c.category].push(c);
    });
    var html = '';
    order.forEach(function(cat) {
      html += '<h2>' + cat + '</h2>';
      byCat[cat].forEach(function(c) {
        html += '<div class="list-item"><span class="li-type">' + c.type + '</span>' + c.question + '</div>';
      });
    });
    listView.innerHTML = html;
  }

  listToggle.addEventListener('click', function() {
    listOpen = !listOpen;
    listView.hidden = !listOpen;
